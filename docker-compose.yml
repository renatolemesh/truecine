services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      PORT: 4000
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      SQLITE_PATH: /app/data/truecine.db
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - default
      - shared-net

volumes:
  qdrant_data:
  sqlite_data:

networks:
  default: {}
  shared-net:
    external: true
