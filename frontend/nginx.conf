server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O navegador sempre fala com a própria origem da página (seja qual for
    # o host/porta usado pra acessar — localhost, IP da máquina, um túnel de
    # port-forward, etc.). O nginx é quem resolve "backend" via a rede
    # interna do docker-compose, então não importa como o front foi acessado.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
